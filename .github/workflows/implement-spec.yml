name: Implement OpenSpec Change

on:
  workflow_dispatch:
    inputs:
      change_name:
        description: 'OpenSpec change name to implement'
        required: true

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Implement spec with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: github-actions[bot]
          show_full_output: true
          prompt: |
            Implement the OpenSpec change "${{ inputs.change_name }}":
            1. Run /opsx:apply ${{ inputs.change_name }} to implement all tasks
            2. Run /opsx:archive ${{ inputs.change_name }} to archive the change
            3. Create a PR against main with all implementation and archive changes
